<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resume — Print</title>
<style>
  @page { size: Letter; margin: 0.6in; }
  * { box-sizing: border-box; }
  body {
    font-family: "Georgia", "Times New Roman", serif;
    color: #1a1a1a;
    margin: 0;
    padding: 0;
    font-size: 11pt;
    line-height: 1.4;
  }
  .sheet { max-width: 7.5in; margin: 0 auto; padding: 0.4in; }
  h1 { margin: 0 0 2px; font-size: 22pt; }
  .title { font-size: 12pt; color: #2a6f68; font-weight: bold; margin-bottom: 6px; }
  .contact { font-size: 9.5pt; color: #444; margin-bottom: 18px; }
  .contact a { color: #444; text-decoration: none; }
  h2 {
    font-size: 12pt;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid #999;
    padding-bottom: 3px;
    margin: 18px 0 8px;
  }
  .summary { margin: 0 0 4px; }
  .entry { margin-bottom: 12px; }
  .entry-head { display: flex; justify-content: space-between; font-weight: bold; font-size: 11pt; }
  .entry-sub { font-style: italic; color: #333; font-size: 10pt; margin-bottom: 4px; }
  ul { margin: 4px 0 0; padding-left: 16px; }
  li { margin-bottom: 2px; }
  .skills-line { margin-bottom: 4px; }
  .skills-line b { display: inline-block; min-width: 140px; }
  #status { font-family: sans-serif; font-size: 10pt; color: #888; text-align: center; padding: 40px; }
</style>
</head>
<body>
<div id="status">Loading resume…</div>
<div class="sheet" id="sheet" style="display:none;"></div>
<script type="module" src="js/print-render.js"></script>
</body>
</html>
