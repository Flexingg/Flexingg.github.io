<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jonathan Randall — Resume</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<style>
  @page {
    size: Letter;
    margin: 0.45in 0.5in;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #111827;
    margin: 0;
    padding: 0;
    font-size: 9.5pt;
    line-height: 1.35;
    background: #fff;
  }
  .sheet {
    max-width: 8in;
    margin: 0 auto;
    padding: 0.4in;
  }
  .resume-header {
    border-bottom: 2px solid #7c3aed;
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  h1 {
    margin: 0 0 2px;
    font-size: 20pt;
    color: #0f172a;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .title {
    font-size: 11pt;
    color: #7c3aed;
    font-weight: 700;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .contact {
    font-size: 9pt;
    color: #4b5563;
  }
  .contact a {
    color: #7c3aed;
    text-decoration: none;
  }
  h2 {
    font-size: 10.5pt;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #7c3aed;
    border-bottom: 1px solid #cbd5e1;
    padding-bottom: 2px;
    margin: 12px 0 6px;
    font-weight: 700;
  }
  .summary {
    margin: 0 0 6px;
    color: #374151;
    font-size: 9pt;
    line-height: 1.4;
  }
  .entry {
    margin-bottom: 9px;
  }
  .entry-head {
    display: flex;
    justify-content: space-between;
    font-size: 9.5pt;
    color: #111827;
  }
  .entry-head strong {
    color: #0f172a;
  }
  .entry-sub {
    font-size: 8.5pt;
    color: #64748b;
    margin-bottom: 2px;
  }
  .entry-overview {
    font-size: 8.5pt;
    font-style: italic;
    color: #4b5563;
    margin-bottom: 3px;
  }
  .edu-details {
    font-size: 8.5pt;
    color: #4b5563;
  }
  ul {
    margin: 2px 0 0;
    padding-left: 14px;
    color: #374151;
  }
  li {
    margin-bottom: 2px;
    font-size: 8.8pt;
    line-height: 1.35;
  }
  .skills-line {
    margin-bottom: 3px;
    font-size: 8.5pt;
    color: #374151;
  }
  .skills-line strong {
    color: #111827;
    display: inline-block;
    min-width: 155px;
  }
  .ref-line {
    font-size: 8.5pt;
    color: #4b5563;
    margin-top: 4px;
  }
  #status {
    font-family: sans-serif;
    font-size: 10pt;
    color: #888;
    text-align: center;
    padding: 40px;
  }

  @media print {
    .sheet {
      padding: 0;
      max-width: none;
    }
  }
</style>
</head>
<body>
<div id="status">Loading resume…</div>
<div class="sheet" id="sheet" style="display:none;"></div>
<script type="module" src="js/print-render.js"></script>
</body>
</html>
